name: Build Minecraft mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Restore Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip
          mkdir -p "$RUNNER_TEMP/wrapgen"
          cd "$RUNNER_TEMP/wrapgen"
          "$GITHUB_WORKSPACE/gradle-4.10.3/bin/gradle" wrapper --gradle-version 4.10.3
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/gradlew"

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: auriolisboreal-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
